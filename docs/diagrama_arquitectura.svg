<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Clips Cortos - Arquitectura</text>

  <!-- Usuario -->
  <rect x="30" y="230" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="100" y="260" text-anchor="middle" font-size="14" fill="#1a1a1a">Usuario</text>
  <text x="100" y="278" text-anchor="middle" font-size="12" fill="#444">navegador</text>

  <!-- Instancia (EC2 / maquina con docker-compose) -->
  <rect x="230" y="90" width="480" height="320" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="470" y="112" text-anchor="middle" font-size="13" fill="#555">Instancia (docker-compose)</text>

  <!-- API container -->
  <rect x="260" y="150" width="200" height="100" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="360" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">api</text>
  <text x="360" y="200" text-anchor="middle" font-size="12" fill="#444">FastAPI</text>
  <text x="360" y="217" text-anchor="middle" font-size="11" fill="#444">/salud /auth /videos</text>
  <text x="360" y="234" text-anchor="middle" font-size="11" fill="#444">puerto 8000</text>

  <!-- Worker container -->
  <rect x="260" y="290" width="200" height="100" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="360" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">worker</text>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#444">ffprobe / ffmpeg</text>
  <text x="360" y="357" text-anchor="middle" font-size="11" fill="#444">duracion + miniatura</text>
  <text x="360" y="374" text-anchor="middle" font-size="11" fill="#444">sondea RDS (pendiente)</text>

  <!-- S3 -->
  <rect x="750" y="140" width="180" height="90" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="840" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">S3</text>
  <text x="840" y="188" text-anchor="middle" font-size="11" fill="#444">originales/ miniaturas/</text>
  <text x="840" y="205" text-anchor="middle" font-size="11" fill="#444">privado + cifrado (SSE-S3)</text>

  <!-- RDS -->
  <rect x="750" y="300" width="180" height="90" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
  <text x="840" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">RDS (Postgres)</text>
  <text x="840" y="348" text-anchor="middle" font-size="11" fill="#444">usuarios, videos</text>
  <text x="840" y="365" text-anchor="middle" font-size="11" fill="#444">cifrada, sin acceso publico</text>

  <!-- Flechas -->
  <line x1="170" y1="265" x2="255" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="205" y="220" font-size="11" fill="#333">HTTP</text>

  <line x1="460" y1="185" x2="748" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="560" y="168" font-size="11" fill="#333">sube video / URLs prefirmadas</text>

  <line x1="460" y1="220" x2="748" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="540" y="260" font-size="11" fill="#333">lee/escribe metadatos</text>

  <line x1="460" y1="330" x2="748" y2="205" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="600" y="300" font-size="11" fill="#333">descarga video / sube miniatura</text>

  <line x1="460" y1="360" x2="748" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#flecha)"/>
  <text x="560" y="352" font-size="11" fill="#333">toma pendientes, actualiza estado</text>

  <!-- Leyenda -->
  <text x="30" y="440" font-size="12" fill="#555">Los dos contenedores (api, worker) nunca se comunican entre si de forma directa.</text>
  <text x="30" y="458" font-size="12" fill="#555">RDS es la cola de trabajo compartida (estado de cada video); S3 es el unico lugar con contenido binario.</text>
  <text x="30" y="476" font-size="12" fill="#555">El security group de RDS solo acepta conexiones desde el security group de esta instancia (sin acceso publico).</text>
</svg>
